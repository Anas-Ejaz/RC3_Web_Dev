# Default: the API uses your Neon DATABASE_URL from .env.
#   docker compose up --build
# Optional local Postgres with pgvector (set DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/recruit):
#   docker compose --profile local-db up --build
services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false   # needs Compose 2.20+; ignored when the local-db profile is off

  db:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: